name: Firmware CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esphome-checks:
    name: ESPHome Configuration & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-esphome-${{ hashFiles('esphome/**/*.yaml', 'external_components/**/*.py', 'external_components/**/*.cpp', 'webapp/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pip-esphome-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: ${{ runner.os }}-platformio-${{ hashFiles('esphome/**/*.yaml', 'external_components/**/*.py', 'external_components/**/*.cpp', 'webapp/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install "esphome==2026.7.1"

      - name: Install RP2040 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build RP2040 coprocessor
        run: |
          cmake -S coprocessor -B coprocessor/build -G Ninja \
            -DPICO_SDK_FETCH_FROM_GIT=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build coprocessor/build --parallel
          python3 coprocessor/embed_firmware.py \
            --check-source \
            esphome/external_components/swd_programmer/firmware.h
          python3 coprocessor/embed_firmware.py \
            coprocessor/build/src/openshrooly_coprocessor.bin \
            esphome/external_components/swd_programmer/firmware.h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Determine build ID
        id: build_id
        run: |
          BUILD_ID="openshrooly"
          echo "Using build id: ${BUILD_ID}"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"

      - name: Build web UI
        env:
          NEXT_BUILD_ID: ${{ steps.build_id.outputs.build_id }}
        run: |
          cd webapp
          npm ci
          node -v
          npm -v
          echo "NEXT_BUILD_ID=$NEXT_BUILD_ID"
          npm run build

      - name: Embed static assets
        run: |
          cd esphome
          python3 external_components/web_server/embed_static_files.py ../webapp/out external_components/web_server/static_files.h external_components/web_server/static_files.cpp

      - name: Verify embedded assets are current
        run: |
          if ! git diff --quiet -- esphome/external_components/web_server/static_files.h esphome/external_components/web_server/static_files.cpp; then
            echo "::error::Embedded dashboard assets differ from repository state. Rerun the embed script and commit the generated files."
            git --no-pager diff --stat -- esphome/external_components/web_server/static_files.h esphome/external_components/web_server/static_files.cpp
            git --no-pager diff -U3 -- esphome/external_components/web_server/static_files.h esphome/external_components/web_server/static_files.cpp | head -n 200
            git status --short esphome/external_components/web_server/static_files.h esphome/external_components/web_server/static_files.cpp
            exit 1
          fi

      - name: Validate configuration
        run: esphome config esphome/openshrooly.yaml

      - name: Compile firmware
        run: esphome compile esphome/openshrooly.yaml
