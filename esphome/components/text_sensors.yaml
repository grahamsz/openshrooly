# ========================================================================
# TEXT SENSORS
# Status display sensors for the web interface
# ========================================================================

text_sensor:
  - platform: template
    id: firmware_version
    name: "Firmware Version"
    internal: true
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: grp_hidden

  # =======================================================================
  # Status Display Sensors
  # These are marked as internal: true to prevent them from syncing to
  # Home Assistant. They are only used for displaying status information
  # in the local web interface. Home Assistant should use the actual
  # sensor values and controls directly rather than these formatted
  # status strings.
  # =======================================================================

  - platform: template
    id: air_exchange_status
    name: "Air Exchange Status"
    internal: true  # Prevents sync to Home Assistant
    icon: mdi:fan-auto
    web_server:
      sorting_group_id: grp_air
      sorting_weight: 1

  - platform: template
    id: lights_status
    name: "Light Status"
    internal: true  # Prevents sync to Home Assistant
    icon: mdi:lightbulb-on-outline
    web_server:
      sorting_group_id: grp_lights
      sorting_weight: 1

  - platform: template
    id: humidifier_fan_status
    name: "Humidifier Status"
    internal: true  # Prevents sync to Home Assistant
    icon: mdi:air-humidifier
    web_server:
      sorting_group_id: grp_humidity
      sorting_weight: 1

  - platform: template
    id: display_layout_status
    name: "Display Layout Status"
    internal: true
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: grp_hidden

  # Calibration status display
  - platform: template
    name: "Calibration Status"
    id: calibration_status
    internal: true  # Prevents sync to Home Assistant
    icon: mdi:information-outline
    update_interval: 1s
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 1
    lambda: |-
      if (!id(is_calibrated)) {
        return {"Not calibrated - using auto mode"};
      } else if (id(calibration_step) == 1) {
        return {"⚠️ Confirm tank is empty"};
      } else {
        return {"✅ Calibrated"};
      }

  # WiFi network mode and info
  - platform: template
    name: "WiFi Mode"
    id: wifi_mode
    icon: mdi:wifi
    update_interval: 5s
    lambda: |-
      if (wifi::global_wifi_component->is_connected()) {
        return {"Station"};
      } else {
        return {"Access Point"};
      }

  - platform: template
    name: "WiFi SSID"
    id: wifi_ssid
    icon: mdi:wifi-marker
    update_interval: 5s
    lambda: |-
      if (wifi::global_wifi_component->is_connected()) {
        char ssid[wifi::SSID_BUFFER_SIZE];
        return {std::string(wifi::global_wifi_component->wifi_ssid_to(ssid))};
      } else {
        return {"OpenShrooly"};
      }

  - platform: template
    name: "IP Address"
    id: ip_address
    icon: mdi:ip-network
    update_interval: 5s
    lambda: |-
      if (wifi::global_wifi_component->is_connected()) {
        auto addresses = wifi::global_wifi_component->wifi_sta_ip_addresses();
        if (addresses.empty()) {
          return {"--"};
        }
        char ip[network::IP_ADDRESS_BUFFER_SIZE];
        addresses[0].str_to(ip);
        return {std::string(ip)};
      } else {
        return {"192.168.4.1"};
      }
