
globals:
  - id: menu_selection
    type: int
    restore_value: no
    initial_value: '0'

  - id: settings_selection
    type: int
    restore_value: no
    initial_value: '0'

  - id: page_just_changed
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: lights_on_flag
    type: bool
    restore_value: no  # Let lighting control manager decide at boot based on schedule
    initial_value: 'false'

  - id: air_exchange_on_flag
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: air_exchange_next_on_ts
    type: int
    restore_value: no
    initial_value: '0'

  - id: air_exchange_next_off_ts
    type: int
    restore_value: no
    initial_value: '0'

  - id: humidifier_on_flag
    type: bool
    restore_value: no  # Don't restore - let control manager decide at boot
    initial_value: 'false'

  # The RP2040 is reflashed during startup. Humidity control must wait until
  # that reset is complete or its first duty command can be silently lost.
  - id: coprocessor_ready
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: humidifier_command_duty
    type: uint8_t
    restore_value: no
    initial_value: '0'

  - id: humidifier_command_succeeded
    type: bool
    restore_value: no
    initial_value: 'false'

  # Humidifier monitoring variables
  - id: humidifier_start_humidity
    type: float
    restore_value: no
    initial_value: '0'

  # Water level calibration values (persist across reboots)
  # Updated default values from your current dry measurements
  - id: water_cal_s0_dry
    type: uint32_t
    restore_value: yes
    initial_value: '42000'  # Average of recent dry readings

  - id: water_cal_s1_dry
    type: uint32_t
    restore_value: yes
    initial_value: '39470'

  - id: water_cal_s2_dry
    type: uint32_t
    restore_value: yes
    initial_value: '38470'

  - id: water_cal_s3_dry
    type: uint32_t
    restore_value: yes
    initial_value: '37395'

  - id: is_calibrated
    type: bool
    restore_value: yes
    initial_value: 'false'  # Keep uncalibrated UI behavior

  # Calibration state
  - id: calibration_step
    type: int
    restore_value: no
    initial_value: '0'

  - id: water_calibration_generation
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Alert tracking globals
  - id: active_alert_count
    type: int
    restore_value: no
    initial_value: '0'

  - id: i2c_failure_count
    type: int
    restore_value: no
    initial_value: '0'

  - id: copro_last_error
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: copro_last_read_u32
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: fan_spinup_failure
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: humidity_not_rising_flag
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: last_sht41_reading_time
    type: unsigned long
    initial_value: '0'

  # Wi-Fi/AP recovery state
  - id: ap_restart_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ap_last_restart_ms
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: ap_status_text
    type: std::string
    restore_value: no
    initial_value: '""'

  # UI globals
  - id: current_ui_page
    type: int
    initial_value: '0'

  - id: last_button_press_time
    type: unsigned long
    initial_value: '0'

  - id: ui_needs_update
    type: bool
    initial_value: 'true'

  - id: display_ready
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: display_layout_flipped
    type: bool
    restore_value: no
    initial_value: 'false'
