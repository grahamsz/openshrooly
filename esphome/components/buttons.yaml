# ========================================================================
# ADAPTIVE TOUCH BUTTONS
# ========================================================================

shrooly_touch:
  id: shrooly_touch_controller
  sample_interval: 5ms
  warmup_duration: 1s
  calibration_samples: 128
  minimum_threshold: 1.2
  noise_multiplier: 8.0

  buttons:
    - id: button_1
      name: "Button 1"
      internal: true
      on_press:
        - script.execute:
            id: touch_button_blip
            button: !lambda 'return id(flip_screen).state ? 4 : 1;'
        - script.execute:
            id: ui_navigation_handler
            button: !lambda 'return id(flip_screen).state ? 4 : 1;'

    - id: button_2
      name: "Button 2"
      internal: true
      on_press:
        - script.execute:
            id: touch_button_blip
            button: !lambda 'return id(flip_screen).state ? 3 : 2;'
        - script.execute:
            id: ui_navigation_handler
            button: !lambda 'return id(flip_screen).state ? 3 : 2;'

    - id: button_3
      name: "Button 3"
      internal: true
      on_press:
        - script.execute:
            id: touch_button_blip
            button: !lambda 'return id(flip_screen).state ? 2 : 3;'
        - script.execute:
            id: ui_navigation_handler
            button: !lambda 'return id(flip_screen).state ? 2 : 3;'

    - id: button_4
      name: "Button 4"
      internal: true
      on_press:
        - script.execute:
            id: touch_button_blip
            button: !lambda 'return id(flip_screen).state ? 1 : 4;'
        - script.execute:
            id: ui_navigation_handler
            button: !lambda 'return id(flip_screen).state ? 1 : 4;'

  # Per-channel touch diagnostics are deliberately omitted in production.
  # Calibration and button detection continue inside the controller without
  # publishing twenty rapidly changing sensor entities.

  backend:
    id: touch_backend
    name: "Touch Backend"

  calibration_status:
    id: touch_calibration_status
    name: "Touch Calibration Status"
