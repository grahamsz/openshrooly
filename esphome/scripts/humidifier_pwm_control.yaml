# ========================================================================
# HUMIDIFIER PWM CONTROL SCRIPT
# Sends the target duty to the coprocessor, which generates the 8Hz PWM.
# ========================================================================

- id: humidifier_pwm_control
  mode: restart
  parameters:
    requested_duty: float
  then:
    - lambda: |-
        float requested = id(humidifier_on_flag) ? requested_duty : 0.0f;
        requested = fmaxf(0.0f, fminf(100.0f, requested));
        id(humidifier_command_duty) =
          static_cast<uint8_t>(lroundf(requested));
        id(humidifier_command_succeeded) = false;

    # The RP2040 may still be coming out of reset when the first control
    # decision arrives. Retry a NACK briefly instead of leaving logical and
    # physical fan state out of sync until somebody changes a setting.
    - repeat:
        count: 4
        then:
          - if:
              condition:
                lambda: 'return !id(humidifier_command_succeeded);'
              then:
                - lambda: |-
                    const uint8_t duty = id(humidifier_command_duty);
                    uint8_t data[2] = {0x18, duty};
                    const bool error = id(bus_a).write(0x6C, data, sizeof(data));
                    id(humidifier_command_succeeded) = !error;

                    if (error) {
                      ESP_LOGW(
                        "humidifier_pwm",
                        "Coprocessor rejected %u%% duty command; retrying",
                        duty
                      );
                    }
                - if:
                    condition:
                      lambda: 'return !id(humidifier_command_succeeded);'
                    then:
                      - delay: 250ms

    - lambda: |-
        const uint8_t duty = id(humidifier_command_duty);
        if (id(humidifier_command_succeeded)) {
          id(i2c_failure_count) = 0;
          ESP_LOGI("humidifier_pwm", "Coprocessor duty set to %u%%", duty);
        } else {
          id(i2c_failure_count)++;
          ESP_LOGE(
            "humidifier_pwm",
            "Coprocessor did not accept %u%% duty after 4 attempts",
            duty
          );
          if (id(i2c_failure_count) == 3) {
            id(alert_beep_critical).execute();
          }
        }
