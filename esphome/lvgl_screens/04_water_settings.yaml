# ========================================================================
# WATER CALIBRATION
# ========================================================================

- id: gwatercalibration
  bg_color: paper_white
  widgets:
    - label:
        text: "Water Calibration"
        align: TOP_MID
        y: 2
        text_font: font1
    - label:
        id: water_level_label
        text: "Level: ---%"
        align: TOP_LEFT
        x: 10
        y: 18
        text_font: font1
    - label:
        id: water_status_label
        text: "Status: --"
        align: TOP_LEFT
        x: 10
        y: 32
        text_font: font1

    - label:
        id: water_calibrate_carat
        text: ">"
        align: TOP_LEFT
        x: 5
        y: 51
        text_font: font1
    - label:
        id: water_calibrate_action
        text: "Calibrate empty tank"
        align: TOP_LEFT
        x: 17
        y: 51
        text_font: font1

    - label:
        id: water_reset_carat
        text: " "
        align: TOP_LEFT
        x: 5
        y: 67
        text_font: font1
    - label:
        text: "Reset water calibration"
        align: TOP_LEFT
        x: 17
        y: 67
        text_font: font1

    - label:
        id: water_touch_carat
        text: " "
        align: TOP_LEFT
        x: 5
        y: 83
        text_font: font1
    - label:
        text: "Recalibrate touch"
        align: TOP_LEFT
        x: 17
        y: 83
        text_font: font1

    - label:
        id: water_action_hint
        text: "Tank must be completely empty"
        align: TOP_LEFT
        x: 10
        y: 96
        text_font: font1

    - obj:
        x: 0
        y: 107
        width: 73
        height: 20
        radius: 0
        border_width: 0
        bg_color: paper_black
        widgets:
          - label:
              text: "Back"
              align: CENTER
              text_color: paper_white
              text_font: font1
    - obj:
        x: 75
        y: 107
        width: 73
        height: 20
        radius: 0
        border_width: 0
        bg_color: paper_black
        widgets:
          - label:
              text: "Up"
              align: CENTER
              text_color: paper_white
              text_font: font1
    - obj:
        x: 150
        y: 107
        width: 73
        height: 20
        radius: 0
        border_width: 0
        bg_color: paper_black
        widgets:
          - label:
              text: "Down"
              align: CENTER
              text_color: paper_white
              text_font: font1
    - obj:
        x: 225
        y: 107
        width: 71
        height: 20
        radius: 0
        border_width: 0
        bg_color: paper_black
        widgets:
          - label:
              text: "Run"
              align: CENTER
              text_color: paper_white
              text_font: font1
